# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "WreckScope"
  productName: "WreckScope"
  productIdentifier: "com.wreckscope.app"
  description: "WreckScope dashboard"
  copyright: "Copyright Monkie"
  comments: "WreckScope dashboard"
  version: "0.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - ui
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    # Must be exactly `common:dev:frontend` (not `…:ui`) so wails3 auto-attaches a
    # TCP readiness gate from FRONTEND_DEVSERVER_URL before starting the app.
    # Without that gate the WebView races Vite and Edge shows 502 on Windows.
    # Task is aliased to ui/ (see build/Taskfile.yml). Vite binds 127.0.0.1 so the
    # AssetServer's tcp4 proxy matches.
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# File Associations
fileAssociations:

# Other data
other: []
