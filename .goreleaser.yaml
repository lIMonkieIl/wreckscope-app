version: 2

project_name: wreckscope

dist: .goreleaser-out

builds:
  - id: skip-go
    skip: true

checksum:
  disable: true

changelog:
  disable: true

release:
  draft: true
  replace_existing_draft: true
  name_template: "WreckScope {{.Version}}"
  mode: keep-existing
  extra_files:
    - glob: ./dist/windows/WreckScope-*-windows-amd64-setup.exe
    - glob: ./dist/windows/SHA256SUMS
