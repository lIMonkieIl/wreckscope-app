name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.29.0

      - name: Install Task
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Wails CLI v3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install NSIS
        shell: bash
        run: choco install nsis -y --no-progress

      - name: Add tools to PATH
        shell: pwsh
        run: |
          $goBin = Join-Path (go env GOPATH) "bin"
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          "PATH=$goBin;$nsis;${env:ProgramFiles}\NSIS;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install UI deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Package Windows NSIS installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version "${{ steps.ver.outputs.version }}" -Arch amd64

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
