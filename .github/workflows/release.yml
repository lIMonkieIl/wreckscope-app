name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.29.0

      - name: Install Task
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Wails CLI v3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # Chocolatey community feed has been 504ing; verify makensis and fall back to the official installer.
      - name: Install NSIS
        shell: pwsh
        run: |
          function Find-MakeNsis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($path in @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "${env:ProgramFiles}\NSIS\makensis.exe"
            )) {
              if (Test-Path $path) { return $path }
            }
            return $null
          }

          $found = Find-MakeNsis
          if ($found) {
            Write-Host "NSIS already present: $found"
          } else {
            $installed = $false
            for ($i = 1; $i -le 3; $i++) {
              Write-Host "Chocolatey NSIS attempt $i/3..."
              & choco install nsis -y --no-progress
              $found = Find-MakeNsis
              if ($found) { $installed = $true; break }
              Start-Sleep -Seconds 12
            }

            if (-not $installed) {
              Write-Host "Chocolatey did not provide makensis; downloading NSIS setup..."
              $ver = "3.10"
              $installer = Join-Path $env:RUNNER_TEMP "nsis-$ver-setup.exe"
              $urls = @(
                "https://downloads.sourceforge.net/project/nsis/NSIS%203/$ver/nsis-$ver-setup.exe",
                "https://sourceforge.net/projects/nsis/files/NSIS%203/$ver/nsis-$ver-setup.exe/download"
              )
              $downloaded = $false
              foreach ($url in $urls) {
                try {
                  Write-Host "GET $url"
                  Invoke-WebRequest -Uri $url -OutFile $installer -UserAgent "Wget/1.21" -MaximumRedirection 8
                  if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 1MB)) {
                    $downloaded = $true
                    break
                  }
                } catch {
                  Write-Host "Download failed: $_"
                }
              }
              if (-not $downloaded) {
                throw "Failed to download NSIS installer (Chocolatey and SourceForge both unavailable)."
              }
              Start-Process -FilePath $installer -ArgumentList "/S" -Wait
              $found = Find-MakeNsis
            }
          }

          if (-not $found) {
            throw "makensis not found after NSIS install."
          }
          Write-Host "makensis: $found"
          & $found /VERSION

      - name: Add tools to PATH
        shell: pwsh
        run: |
          $goBin = Join-Path (go env GOPATH) "bin"
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          "PATH=$goBin;$nsis;${env:ProgramFiles}\NSIS;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install UI deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Package Windows NSIS installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version "${{ steps.ver.outputs.version }}" -Arch amd64

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
